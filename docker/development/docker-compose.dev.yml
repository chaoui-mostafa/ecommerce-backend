version: '3.8'

services:
  api-dev:
    build:
      context: ../..
      dockerfile: docker/development/Dockerfile.dev
    container_name: ecommerce-api-dev
    environment:
      - NODE_ENV=development
      - MONGODB_URI=mongodb://mongodb-dev:27017/ecommerce-dev
      - REDIS_HOST=redis-dev
      - REDIS_PORT=6379
      - DEBUG=express:*
    ports:
      - "5000:5000"
      - "9229:9229"
      - "9230:9230" # Additional debug port
    volumes:
      - ../../src:/usr/src/app/src
      - ../../tests:/usr/src/app/tests
      - ../../uploads:/usr/src/app/uploads
      - ../../logs:/usr/src/app/logs
      - /usr/src/app/node_modules
    depends_on:
      - mongodb-dev
      - redis-dev
    networks:
      - dev-network
    command: npm run dev

  mongodb-dev:
    image: mongo:6-jammy
    container_name: ecommerce-mongodb-dev
    environment:
      MONGO_INITDB_ROOT_USERNAME: devuser
      MONGO_INITDB_ROOT_PASSWORD: devpass123
      MONGO_INITDB_DATABASE: ecommerce-dev
    ports:
      - "27018:27017" # Different port to avoid conflict with production
    volumes:
      - mongodb-dev-data:/data/db
      - ../../mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - dev-network

  redis-dev:
    image: redis:7-alpine
    container_name: ecommerce-redis-dev
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-dev-data:/data
    networks:
      - dev-network

  mongo-express-dev:
    image: mongo-express:latest
    container_name: ecommerce-mongo-express-dev
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: devuser
      ME_CONFIG_MONGODB_ADMINPASSWORD: devpass123
      ME_CONFIG_MONGODB_SERVER: mongodb-dev
    ports:
      - "8083:8081"
    depends_on:
      - mongodb-dev
    networks:
      - dev-network

  mailhog-dev:
    image: mailhog/mailhog:latest
    container_name: ecommerce-mailhog-dev
    ports:
      - "1025:1025" # SMTP server
      - "8025:8025" # Web UI
    networks:
      - dev-network

volumes:
  mongodb-dev-data:
  redis-dev-data:

networks:
  dev-network:
    driver: bridge